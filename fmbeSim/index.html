<!DOCTYPE html>
<html lang="en">
  <head>
    <title>fmbeSim</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Simulate FMBE & Generate Command">
    <meta property="og:title" content="fmbeSim">
    <meta property="og:description" content="Simulate FMBE & Generate Command">
    <meta property="og:image" content="https://szea-ll14.github.io/fmbeSim/img/ogp-image.png">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://szea-ll14.github.io/fmbeSim/">
    <meta name="twitter:card" content="summary">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="app-body">
      <div id="app-view"><canvas id="canvas"></canvas></div>
      <div id="app-bar"></div>
      <div id="app-control">
        <div class="seg group">
          <label><input type="radio" name="tab" value="parameters" checked>Parameters</label>
          <label><input type="radio" name="tab" value="base">Base</label>
          <label><input type="radio" name="tab" value="settings">Settings</label>
        </div>
        <div id="tab-parameters" class="tab">
          <table class="group">
            <tr>
              <td>xpos</td>
              <td><input type="number" id="xpos-input" value="0" step="1" /></td>
              <td><input type="range" id="xpos-slider" min="-80" max="80" value="0" step="0.1" /></td>
              <td><button type="button" id="xpos-reset">Reset</button></td>
            </tr>
            <tr>
              <td>ypos</td>
              <td><input type="number" id="ypos-input" value="0" step="1" /></td>
              <td><input type="range" id="ypos-slider" min="-80" max="80" value="0" step="0.1" /></td>
              <td><button type="button" id="ypos-reset">Reset</button></td>
            </tr>
            <tr>
              <td>zpos</td>
              <td><input type="number" id="zpos-input" value="0" step="1" /></td>
              <td><input type="range" id="zpos-slider" min="-80" max="80" value="0" step="0.1" /></td>
              <td><button type="button" id="zpos-reset">Reset</button></td>
            </tr>
            <tr>
              <td>xrot</td>
              <td><input type="number" id="xrot-input" value="0" step="5" /></td>
              <td><input type="range" id="xrot-slider" min="-180" max="180" value="0" step="0.1" /></td>
              <td><button type="button" id="xrot-reset">Reset</button></td>
            </tr>
            <tr>
              <td>yrot</td>
              <td><input type="number" id="yrot-input" value="0" step="5" /></td>
              <td><input type="range" id="yrot-slider" min="-180" max="180" value="0" step="0.1" /></td>
              <td><button type="button" id="yrot-reset">Reset</button></td>
            </tr>
            <tr>
              <td>zrot</td>
              <td><input type="number" id="zrot-input" value="0" step="5" /></td>
              <td><input type="range" id="zrot-slider" min="-180" max="180" value="0" step="0.1" /></td>
              <td><button type="button" id="zrot-reset">Reset</button></td>
            </tr>
            <tr>
              <td>scale</td>
              <td><input type="number" id="scale-input" value="1" step="0.1" /></td>
              <td><input type="range" id="scale-slider" min="0" max="5" value="1" step="0.01" /></td>
              <td><button type="button" id="scale-reset">Reset</button></td>
            </tr>
            <tr>
              <td>xzscale</td>
              <td><input type="number" id="xzscale-input" value="1" step="0.1" /></td>
              <td><input type="range" id="xzscale-slider" min="0" max="5" value="1" step="0.01" /></td>
              <td><button type="button" id="xzscale-reset">Reset</button></td>
            </tr>
            <tr>
              <td>yscale</td>
              <td><input type="number" id="yscale-input" value="1" step="0.1" /></td>
              <td><input type="range" id="yscale-slider" min="0" max="5" value="1" step="0.01" /></td>
              <td><button type="button" id="yscale-reset">Reset</button></td>
            </tr>
            <tr>
              <td>xbasepos</td>
              <td><input type="number" id="xbasepos-input" value="0" step="1" /></td>
              <td><input type="range" id="xbasepos-slider" min="-80" max="80" value="0" step="0.1" /></td>
              <td><button type="button" id="xbasepos-reset">Reset</button></td>
            </tr>
            <tr>
              <td>ybasepos</td>
              <td><input type="number" id="ybasepos-input" value="0" step="1" /></td>
              <td><input type="range" id="ybasepos-slider" min="-80" max="80" value="0" step="0.1" /></td>
              <td><button type="button" id="ybasepos-reset">Reset</button></td>
            </tr>
            <tr>
              <td>zbasepos</td>
              <td><input type="number" id="zbasepos-input" value="0" step="1" /></td>
              <td><input type="range" id="zbasepos-slider" min="-80" max="80" value="0" step="0.1" /></td>
              <td><button type="button" id="zbasepos-reset">Reset</button></td>
            </tr>
          </table>
          <div class="group">
            <div>
            Item:
            <select id="block-texture">
              <option value="diamond_block">Diamond Block</option>
              <option value="curved_pumpkin">Curved Pumpkin</option>
              <option value="cartography_table">Cartography Table</option>
              <option value="chain_command_block">Chain Command Block</option>
              <option value="alex">Alex Head Block</option>
            </select>
            </div>
            <div>
              <label>Full<input id="command-full" type="checkbox"></label>
            </div>
          </div>
          <div class="group">
            <div class="cmdbox" id="cmd-input">
              <div>
                <span>76 characters</span>
                <button type="button">Copy</button>
              </div>
              <pre>playanimation @e[tag=fmbe] animation.player.attack.positions _ 0 "" setValue</pre>
            </div>
          </div>
        </div>
        <div id="tab-base" class="tab">
          <div class="group">
            はまだ
          </div>
        </div>
        <div id="tab-settings" class="tab">
          <div class="group">
            <div>
              Theme:
              <span class="seg">
                <label><input type="radio" name="theme" value="auto" checked>Auto</label>
                <label><input type="radio" name="theme" value="light">Light</label>
                <label><input type="radio" name="theme" value="dark">Dark</label>
              </span>
            </div>
            <div>
              Layout:
              <span class="seg">
                <label><input type="radio" name="layout" value="auto" checked>Auto</label>
                <label><input type="radio" name="layout" value="side-by-side">Side by side</label>
                <label><input type="radio" name="layout" value="stacked">Stacked</label>
              </span>
            </div>
          </div>
          <div class="group">
            <div><a href="https://github.com/szea-ll14/szea-ll14.github.io/tree/main/fmbeSim">Code</a></div>
          </div>
        </div>
      </div>
    </div>
    <script src="main.js" type="module"></script>
  </body>
</html>
