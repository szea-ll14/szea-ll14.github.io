<!DOCTYPE html>
<html>
  <head>
    <title>fmbeSim</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Simulate FMBE & Generate Command">
    <meta property="og:title" content="fmbeSim">
    <meta property="og:description" content="Simulate FMBE & Generate Command">
    <meta property="og:image" content="https://szea-ll14.github.io/fmbeSim/img/ogp-image.png">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://szea-ll14.github.io/fmbeSim/">
    <meta name="twitter:card" content="summary">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="appBody">
      <div id="appView"><canvas id="canvas"></canvas></div>
      <div id="appBar"></div>
      <div id="appControl">
        <div>
          Block : 
          <select id="blockTexture">
            <option value="diamond_block">Diamond Block</option>
            <option value="curved_pumpkin">Curved Pumpkin</option>
            <option value="cartography_table">Cartography Table</option>
            <option value="chain_command_block">Chain Command Block</option>
            <option value="alex">Alex Head Block</option>
          </select>
        </div>
        <table>
          <tr>
            <td>xpos</td>
            <td><input type="number" id="xposInput" value="0" step="1" /></td>
            <td><input type="range" id="xposSlider" min="-80" max="80" value="0" step="0.1" /></td>
            <td><button type="button" id="xposReset">Reset</button></td>
          </tr>
          <tr>
            <td>ypos</td>
            <td><input type="number" id="yposInput" value="0" step="1" /></td>
            <td><input type="range" id="yposSlider" min="-80" max="80" value="0" step="0.1" /></td>
            <td><button type="button" id="yposReset">Reset</button></td>
          </tr>
          <tr>
            <td>zpos</td>
            <td><input type="number" id="zposInput" value="0" step="1" /></td>
            <td><input type="range" id="zposSlider" min="-80" max="80" value="0" step="0.1" /></td>
            <td><button type="button" id="zposReset">Reset</button></td>
          </tr>
          <tr>
            <td>xrot</td>
            <td><input type="number" id="xrotInput" value="0" step="5" /></td>
            <td><input type="range" id="xrotSlider" min="-180" max="180" value="0" step="0.1" /></td>
            <td><button type="button" id="xrotReset">Reset</button></td>
          </tr>
          <tr>
            <td>yrot</td>
            <td><input type="number" id="yrotInput" value="0" step="5" /></td>
            <td><input type="range" id="yrotSlider" min="-180" max="180" value="0" step="0.1" /></td>
            <td><button type="button" id="yrotReset">Reset</button></td>
          </tr>
          <tr>
            <td>zrot</td>
            <td><input type="number" id="zrotInput" value="0" step="5" /></td>
            <td><input type="range" id="zrotSlider" min="-180" max="180" value="0" step="0.1" /></td>
            <td><button type="button" id="zrotReset">Reset</button></td>
          </tr>
          <tr>
            <td>scale</td>
            <td><input type="number" id="scaleInput" value="1" step="0.1" /></td>
            <td><input type="range" id="scaleSlider" min="0" max="5" value="1" step="0.01" /></td>
            <td><button type="button" id="scaleReset">Reset</button></td>
          </tr>
          <tr>
            <td>xzscale</td>
            <td><input type="number" id="xzscaleInput" value="1" step="0.1" /></td>
            <td><input type="range" id="xzscaleSlider" min="0" max="5" value="1" step="0.01" /></td>
            <td><button type="button" id="xzscaleReset">Reset</button></td>
          </tr>
          <tr>
            <td>yscale</td>
            <td><input type="number" id="yscaleInput" value="1" step="0.1" /></td>
            <td><input type="range" id="yscaleSlider" min="0" max="5" value="1" step="0.01" /></td>
            <td><button type="button" id="yscaleReset">Reset</button></td>
          </tr>
          <tr>
            <td>xbasepos</td>
            <td><input type="number" id="xbaseposInput" value="0" step="1" /></td>
            <td><input type="range" id="xbaseposSlider" min="-80" max="80" value="0" step="0.1" /></td>
            <td><button type="button" id="xbaseposReset">Reset</button></td>
          </tr>
          <tr>
            <td>ybasepos</td>
            <td><input type="number" id="ybaseposInput" value="0" step="1" /></td>
            <td><input type="range" id="ybaseposSlider" min="-80" max="80" value="0" step="0.1" /></td>
            <td><button type="button" id="ybaseposReset">Reset</button></td>
          </tr>
          <tr>
            <td>zbasepos</td>
            <td><input type="number" id="zbaseposInput" value="0" step="1" /></td>
            <td><input type="range" id="zbaseposSlider" min="-80" max="80" value="0" step="0.1" /></td>
            <td><button type="button" id="zbaseposReset">Reset</button></td>
          </tr>
        </table>
        <div>
          <button id="commandCopy" type="button">Copy</button><label><input id="commandFull" type="checkbox">Full</label>
          <pre id="command">?</pre>
        </div>
        <div><a href="https://github.com/szea-ll14/szea-ll14.github.io/tree/main/fmbeSim">なかみ</a></div>
      </div>
    </div>
    <script src="main.js" type="module"></script>
  </body>
</html>
